name: Re-score stored filings

# Scores rows the pipeline never saw — stored by an older version, or stored
# with only a keyword summary because extraction failed (the 2026-09-14 →
# 09-24 out-of-credits stretch). A gap backfill can't reach these: dedupe
# skips accession numbers already stored with text. Then prices outcomes so
# newly flagged filings reach /scorecard in the same run.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest filed_date (YYYY-MM-DD)"
        required: true
      until:
        description: "Latest filed_date (YYYY-MM-DD, blank = no bound)"
        required: false
      no_judge:
        description: "Detectors only, no judge calls (history: ~1/3 of the cost)"
        type: boolean
        default: false
      limit:
        description: "Stop after N filings (0 = all). Use 1 to check the API can pay."
        required: false
        default: "0"

concurrency:
  # Context building calls SEC; never overlap the daily job's rate limit.
  group: daily-ingest
  cancel-in-progress: false

jobs:
  reanalyze:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Re-score ${{ github.event.inputs.since }} to ${{ github.event.inputs.until || 'now' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
        run: |
          python reanalyze.py \
            --since "${{ github.event.inputs.since }}" \
            ${{ github.event.inputs.until && format('--until {0}', github.event.inputs.until) || '' }} \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            ${{ github.event.inputs.no_judge == 'true' && '--no-judge' || '' }}

      - name: Price outcomes for anything newly flagged
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python outcomes.py
