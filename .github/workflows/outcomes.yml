name: Re-price outcomes

# Prices every outcome row that needs it from daily closing history — the same
# step the daily job runs, without the ingest. No model calls, no SEC traffic:
# use it after changing outcome pricing, or to refresh /scorecard on demand.

on:
  workflow_dispatch:

concurrency:
  group: outcomes
  cancel-in-progress: false

jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Price outcomes from history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python outcomes.py
